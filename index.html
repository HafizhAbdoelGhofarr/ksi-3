<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Monitoring Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            padding: 30px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .summary-card h3 {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .summary-card .number {
            font-size: 32px;
            font-weight: bold;
        }

        .hosts {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .host-card {
            background: white;
            border-radius: 15px;
            padding: 22px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .host-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .host-name {
            font-size: 18px;
            font-weight: bold;
        }

        .domain {
            color: #6b7280;
            font-size: 14px;
            margin-top: 5px;
        }

        .badge {
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .online {
            background: #dcfce7;
            color: #166534;
        }

        .down {
            background: #fee2e2;
            color: #991b1b;
        }

        .info {
            border-top: 1px solid #eee;
            padding-top: 15px;
            margin-top: 15px;
            font-size: 13px;
            color: #6b7280;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #6b7280;
        }

        @media (max-width: 700px) {
            .summary,
            .hosts {
                grid-template-columns: 1fr;
            }

            body {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🌐 Network Monitoring</h1>
    <p class="subtitle">
        Monitoring status 8 host secara real-time
    </p>

    <div class="summary">
        <div class="summary-card">
            <h3>Total Host</h3>
            <div class="number" id="total">0</div>
        </div>

        <div class="summary-card">
            <h3>Online</h3>
            <div class="number" id="online">0</div>
        </div>

        <div class="summary-card">
            <h3>Down</h3>
            <div class="number" id="down">0</div>
        </div>
    </div>

    <div id="hosts" class="hosts">
        <div class="loading">
            Mengambil data monitoring...
        </div>
    </div>

</div>

<script>

const WEBHOOK_URL =
    "http://localhost:5678/webhook-test/network-status";


async function loadData() {

    try {

        const response = await fetch(WEBHOOK_URL);

        if (!response.ok) {
            throw new Error("HTTP Error " + response.status);
        }

        const data = await response.json();

        renderDashboard(data);

    } catch (error) {

        console.error("Gagal mengambil data:", error);

        document.getElementById("hosts").innerHTML = `
            <div class="loading">
                ❌ Gagal mengambil data dari n8n
                <br><br>
                Pastikan workflow n8n sedang aktif.
            </div>
        `;
    }
}


function renderDashboard(hosts) {

    const total = hosts.length;

    const online = hosts.filter(
        host => host.status === "ONLINE"
    ).length;

    const down = hosts.filter(
        host => host.status === "DOWN"
    ).length;


    document.getElementById("total").textContent = total;
    document.getElementById("online").textContent = online;
    document.getElementById("down").textContent = down;


    const container = document.getElementById("hosts");

    container.innerHTML = "";


    hosts.forEach(host => {

        const isOnline = host.status === "ONLINE";

        const card = document.createElement("div");

        card.className = "host-card";


        const checkedTime = host.lastChecked
            ? new Date(host.lastChecked).toLocaleString("id-ID")
            : "-";


        card.innerHTML = `

            <div class="host-header">

                <div>
                    <div class="host-name">
                        ${host.name || host.host}
                    </div>

                    <div class="domain">
                        ${host.host}
                    </div>
                </div>

                <span class="badge ${isOnline ? "online" : "down"}">
                    ${host.status}
                </span>

            </div>


            <div class="info">

                <div>
                    Status Code:
                    ${host.statusCode ?? "-"}
                </div>

                <div>
                    Last Check:
                    ${checkedTime}
                </div>

            </div>

        `;


        container.appendChild(card);

    });

}


// Ambil data pertama kali
loadData();


// Update setiap 10 detik
setInterval(loadData, 10000);

</script>

</body>
</html>
